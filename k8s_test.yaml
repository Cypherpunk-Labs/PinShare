apiVersion: apps/v1
kind: Deployment
metadata:
  name: pinshare-dev
  namespace: pinshare
spec:
  replicas: 1
  selector: {matchLabels: {app: upnp-app}}
  template:
    metadata: {labels: {app: upnp-app}}
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
      - name: pinshare
        image: ghcr.io/cypherpunk-labs/pinshare:v0.1.3_g4f
        imagePullPolicy: IfNotPresent
        volumeMounts:
        - name: bin-vol
          mountPath: /opt/pinshare/bin/pinshare  # Override binary
        ports:
        - containerPort: 50001
          protocol: UDP
        - containerPort: 50002
          protocol: UDP
        - containerPort: 50001
          protocol: TCP
        - containerPort: 50002
          protocol: TCP
        - containerPort: 4001
          protocol: UDP
        - containerPort: 4001
          protocol: TCP
        - containerPort: 5001
          protocol: TCP
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8081
          protocol: TCP
        - containerPort: 1900
          protocol: UDP
        - containerPort: 32767
          protocol: UDP      
        env:
        - name: PS_GROUPNAME
          value: "lab28nov"
        - name: PS_LIBP2P_PORT
          value: "50001"
        - name: PS_FF_P2PCIRCUIT
          value: "FALSE"
        - name: PS_FF_TRNSPT_WS
          value: "FALSE"
        - name: PS_FF_TRNSPT_QUIC
          value: "FALSE"
        - name: PS_FF_TRNSPT_WEBRTC
          value: "FALSE"
      volumes:
      - name: bin-vol
        hostPath:
          path: /tmp/pinshare-dev/bin/pinshare  # mule01 fs
          type: File
---          
apiVersion: v1
kind: Service
metadata:
  name: upnp-nodeport-service
  namespace: pinshare
spec:
  type: NodePort
  selector:
    app: upnp-app
  ports:
    - name: upnp-discovery
      protocol: UDP
      port: 1900
      targetPort: 1900
      nodePort: 31900
    - name: upnp-response
      protocol: UDP
      port: 32767
      targetPort: 32767
      nodePort: 32767
